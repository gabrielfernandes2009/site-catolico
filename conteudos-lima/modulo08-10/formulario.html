<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario HTML</title>
</head>
<body>
    <h1>
        Cadastro de Cliente
    </h1>
    <form action="">
        <label for="nome">
            Nome:
        </label>
        <br>
        <input type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome completo"
        required>
        <br><br>
        <label for="email">
            E-mail:
        </label>
        <br>
        <input type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required>
        <br><br>
        <label for="idade">
            Idade:
        </label>
        <br>
        <input type="number"
        id="idade"
        name="idade"
        min="18"
        max="120"
        required>
        <br><br>
        <label for="telefone">
            Telefone:
        </label>
        <br>
        <input type="tel"
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00) 00000-0000">
        <br><br>

        <p>Qual curso deseja fazer?</p>
        <input type="checkbox" id="html">
        <label for="html">HTML5</label>
        <br>
        <input type="checkbox" id="css">
        <label for="css">CSS</label>
        <br>
        
        <input type="checkbox" id="javascript">
        <label for="javascript">Javascript</label>
        <br><br>

        <p>Qual o período desejado?</p>

        <input
            type="radio"
            name="turno"
            id="manha">

        <label for="manha">
            Manhã
        </label>
        <br>
         <input
            type="radio"
            name="turno"
            id="tarde">

        <label for="tarde">
            Tarde
        </label>
        <br>
         <input
            type="radio"
            name="turno"
            id="noite">

        <label for="noite">
            Noite
        </label>
        <br> <br>

        <select name="exemplo" id="exemplo">
            <option value="default" selected>
                Escolha uma das frutas              
            </option>

            <option value="fruta1">
                Laranja
            </option>

            <option value="fruta2">
                Pera
            </option>

            <option value="fruta3">
                Abacaxi 
            </option>

            <option value="fruta4">
                Abacate 
            </option>

        </select>

        <br><br>
        <button type="submit">
            Cadastrar
        </button>

    </form>
    
</body>
</html>
